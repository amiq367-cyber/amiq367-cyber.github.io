          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          Daliny - تشغيل تجهيز مباني Overture لكل محافظة (يُشغَّل على GitHub Actions من جذر المستودع).

          الإعدادات (متغيرات بيئة، أو ملف bld-request.txt بسطور key=value):
              BLD_MODE      debug = تجربة صغيرة حول الحلة (تحفظ الملف الخام للفحص) | build = تجهيز المحافظات
              BLD_IDS       babil karbala ...  أو all
              BLD_RELEASE   إصدار Overture (فارغ = الافتراضي)
              BLD_MIN_AREA  حذف المباني الأصغر من هذي المساحة (0 = لا يحذف)

          لكل محافظة: pmtiles extract (z14 فقط) -> bld_slim -> pmtiles convert -> pmtiles verify -> bld_check
          ثم ينسخ bld/<id>.pmtiles ويكتب bld/report/<id>.json و bld/index.json
          """
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          import urllib.request

          HERE = os.path.dirname(os.path.abspath(__file__))
          sys.path.insert(0, HERE)
          import bld_slim  # noqa: E402
          import bld_check  # noqa: E402

          REQ = os.environ.get('BLD_REQUEST', 'bld-request.txt')
          OUT = os.environ.get('BLD_OUT', 'bld')
          WORK = os.environ.get('BLD_WORK', '/tmp/bldwork')
          BASE = 'https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com'
          DEFAULT_RELEASE = '2026-10-21.0'
          MAX_FILE = 95 * 1000 * 1000     # حد GitHub للملف 100MB
          MAX_DEBUG_RAW = 40 * 1000 * 1000
          PMTILES = os.environ.get('PMTILES_BIN', 'pmtiles')
          DEBUG_SHARD = {'id': 'hilla-debug', 'name': 'تجربة الحلة', 'bbox': [44.38, 32.43, 44.48, 32.53]}


          def log(*a):
              print(*a, flush=True)


          def tail(s, n=2500):
              s = s or ''
              return s[-n:]


          def run(cmd, timeout):
              t0 = time.time()
              log('$', ' '.join(cmd))
              p = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
              log('  -> exit %d (%.0f s)' % (p.returncode, time.time() - t0))
              if p.returncode != 0:
                  log(tail(p.stdout), tail(p.stderr))
              return p


          def parse_request(path):
              req = {'mode': 'build', 'release': '', 'ids': [], 'min_area': 0.0, 'skip': []}
              if os.path.exists(path):
                  for line in open(path, encoding='utf8'):
                      line = line.split('#', 1)[0].strip()
                      if '=' not in line:
                          continue
                      k, v = [x.strip() for x in line.split('=', 1)]
                      if k == 'mode':
                          req['mode'] = v
                      elif k == 'release':
                          req['release'] = v
                      elif k == 'ids':
                          req['ids'] = [x for x in re.split(r'[\s,]+', v) if x]
                      elif k == 'min_area':
                          try:
                              req['min_area'] = float(v)
                          except ValueError:
                              pass
              env = os.environ
              if env.get('BLD_MODE'):
                  req['mode'] = env['BLD_MODE'].strip()
              if env.get('BLD_RELEASE') is not None and env.get('BLD_RELEASE', '').strip():
                  req['release'] = env['BLD_RELEASE'].strip()
              if env.get('BLD_IDS', '').strip():
                  req['ids'] = [x for x in re.split(r'[\s,]+', env['BLD_IDS'].strip()) if x]
              if env.get('BLD_SKIP', '').strip():
                  req['skip'] = [x for x in re.split(r'[\s,]+', env['BLD_SKIP'].strip()) if x]
              if env.get('BLD_MIN_AREA', '').strip():
                  try:
                      req['min_area'] = float(env['BLD_MIN_AREA'].strip())
                  except ValueError:
                      pass
              return req


          def head_ok(url):
              try:
                  r = urllib.request.Request(url, method='HEAD')
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return resp.status == 200, dict(resp.headers)
              except Exception as e:
                  return False, {'error': str(e)}


          LIST_NOTE = {}


          def latest_release():
              """يبحث بقائمة الدلو العامة عن أحدث إصدار tiles/<date>/ (إذا الإصدار المثبّت ما اشتغل)"""
              try:
                  u = BASE + '/?list-type=2&prefix=tiles/&delimiter=/'
                  with urllib.request.urlopen(u, timeout=60) as resp:
                      xml = resp.read().decode('utf8', 'replace')
                  LIST_NOTE['snippet'] = xml[:300]
                  rels = sorted(set(re.findall(r'<Prefix>tiles/([0-9][^/<]*)/</Prefix>', xml)))
                  return rels
              except Exception as e:
                  LIST_NOTE['error'] = str(e)[:300]
                  log('تعذّر سرد الإصدارات:', e)
                  return []


          def resolve_source(req_release, notes):
              forced = os.environ.get('BLD_SOURCE_URL')
              if forced:
                  notes.append('مصدر مفروض: ' + forced)
                  return forced, req_release or 'forced'
              tried = []
              rel = req_release or DEFAULT_RELEASE
              url = '%s/tiles/%s/buildings.pmtiles' % (BASE, rel)
              ok, hdr = head_ok(url)
              tried.append({'url': url, 'ok': ok, 'headers': {k: hdr[k] for k in hdr if k.lower() in ('content-length', 'accept-ranges', 'error', 'last-modified')}})
              if ok:
                  notes.append({'tried': tried})
                  return url, rel
              rels = latest_release()
              notes.append({'tried': tried, 'releases_listed': rels[-6:], 'list_note': LIST_NOTE})
              for rel in reversed(rels):
                  url = '%s/tiles/%s/buildings.pmtiles' % (BASE, rel)
                  ok, hdr = head_ok(url)
                  tried.append({'url': url, 'ok': ok})
                  if ok:
                      return url, rel
              return None, None


          def build_shard(sh, url, release, min_area, debug=False):
              sid = sh['id']
              rep = {'id': sid, 'name': sh.get('name'), 'bbox': sh['bbox'], 'release': release, 'status': 'start', 'debug': debug}
              t0 = time.time()
              os.makedirs(WORK, exist_ok=True)
              raw = os.path.join(WORK, sid + '.raw.pmtiles')
              mb = os.path.join(WORK, sid + '.mbtiles')
              fin = os.path.join(WORK, sid + '.pmtiles')
              for f in (raw, mb, fin):
                  if os.path.exists(f):
                      os.remove(f)
              bbox = ','.join(repr(float(v)) for v in sh['bbox'])
              dest_dir = os.path.join(OUT, 'debug') if debug else OUT
              try:
                  if debug:
                      p = run([PMTILES, 'show', url], 10 * 60)
                      rep['source_show'] = tail(p.stdout + p.stderr, 7000)
                  p = run([PMTILES, 'extract', url, raw, '--bbox=' + bbox, '--minzoom=14', '--maxzoom=14', '--download-threads=8'], 90 * 60)
                  if p.returncode != 0 or not os.path.exists(raw):
                      rep.update(status='extract_failed', log_tail=tail(p.stdout + p.stderr))
                      return rep
                  rep['raw_bytes'] = os.path.getsize(raw)
                  if debug and rep['raw_bytes'] <= MAX_DEBUG_RAW:
                      os.makedirs(dest_dir, exist_ok=True)
                      shutil.copyfile(raw, os.path.join(dest_dir, sid + '.raw.pmtiles'))
                      rep['raw_saved'] = True
                  rep['slim'] = bld_slim.run_slim(raw, mb, sid, sh['bbox'], release, min_area, log=log)
                  os.remove(raw)
                  if rep['slim']['tiles_out'] == 0:
                      rep.update(status='no_tiles')
                      return rep
                  p = run([PMTILES, 'convert', mb, fin], 60 * 60)
                  if p.returncode != 0 or not os.path.exists(fin):
                      rep.update(status='convert_failed', log_tail=tail(p.stdout + p.stderr))
                      return rep
                  os.remove(mb)
                  p = run([PMTILES, 'verify', fin], 20 * 60)
                  rep['verify'] = {'exit': p.returncode, 'log_tail': tail(p.stdout + p.stderr, 800)}
                  if p.returncode != 0:
                      rep.update(status='verify_failed')
                      return rep
                  chk = bld_check.check(fin)
                  rep['check'] = chk
                  if chk['problems']:
                      rep.update(status='check_failed')
                      return rep
                  size = os.path.getsize(fin)
                  rep['bytes'] = size
                  if size > MAX_FILE:
                      rep.update(status='too_big')
                      return rep
                  os.makedirs(dest_dir, exist_ok=True)
                  shutil.copyfile(fin, os.path.join(dest_dir, sid + '.pmtiles'))
                  rep['status'] = 'ok'
                  return rep
              except subprocess.TimeoutExpired as e:
                  rep.update(status='timeout', log_tail=str(e)[:500])
                  return rep
              except Exception:  # noqa: BLE001
                  import traceback
                  rep.update(status='error', log_tail=traceback.format_exc()[-2500:])
                  return rep
              finally:
                  rep['seconds'] = round(time.time() - t0, 1)
                  for f in (raw, mb, fin):
                      try:
                          if os.path.exists(f):
                              os.remove(f)
                      except OSError:
                          pass


          def write_readme():
              p = os.path.join(OUT, 'README.md')
              if os.path.exists(p):
                  return
              os.makedirs(OUT, exist_ok=True)
              with open(p, 'w', encoding='utf8') as f:
                  f.write('# Daliny - building footprints (generated)\n\n'
                          'Slimmed vector tiles (PMTiles, zoom 14, layer `buildings`, attribute `h` = height in metres when known)\n'
                          'generated from the Overture Maps Foundation buildings theme.\n\n'
                          'Data: (c) OpenStreetMap contributors, (c) Overture Maps Foundation.\n'
                          'The buildings theme includes OpenStreetMap data and is made available under the Open Database License (ODbL 1.0);\n'
                          'the files in this folder are a derived database and are provided under the same licence.\n'
                          'See https://docs.overturemaps.org/attribution\n')


          def write_summary(mode, url, release, rows):
              """جدول ملخّص يظهر بصفحة التشغيل في GitHub"""
              p = os.environ.get('GITHUB_STEP_SUMMARY')
              if not p:
                  return
              try:
                  with open(p, 'a', encoding='utf8') as f:
                      f.write('### Daliny buildings - %s - Overture %s\n\n' % (mode, release))
                      f.write('| shard | status | MB | buildings | with height | seconds |\n|---|---|---|---|---|---|\n')
                      for sid, st, size, n, wh, sec in rows:
                          f.write('| %s | %s | %s | %s | %s | %s |\n' % (sid, st, ('%.1f' % (size / 1e6)) if size else '-', n if n is not None else '-', wh if n is not None else '-', sec))
                      f.write('\n')
              except OSError:
                  pass


          def main():
              req = parse_request(REQ)
              shards = json.load(open(os.path.join(HERE, 'shards.json'), encoding='utf8'))['shards']
              byid = {s['id']: s for s in shards}
              debug = req['mode'] == 'debug'
              os.makedirs(os.path.join(OUT, 'report'), exist_ok=True)
              write_readme()
              ids = req['ids']
              if debug:
                  ids = [DEBUG_SHARD['id']]
                  byid[DEBUG_SHARD['id']] = DEBUG_SHARD
              elif ids == ['all']:
                  ids = [s['id'] for s in shards]
              elif not ids:
                  ids = ['babil']
              if req['skip']:
                  ids = [i for i in ids if i not in req['skip']]
              unknown = [i for i in ids if i not in byid]
              log('الوضع:', req['mode'], '| المحافظات:', ids, '| الإصدار المطلوب:', req['release'] or '(افتراضي)', '| min_area:', req['min_area'])
              notes = []
              url, release = resolve_source(req['release'], notes)
              log('المصدر:', url, release)
              if not url:
                  with open(os.path.join(OUT, 'report', '_error.json'), 'w', encoding='utf8') as f:
                      json.dump({'error': 'no source', 'notes': notes, 'unknown_ids': unknown}, f, ensure_ascii=False, indent=1)
                  return 1
              index_path = os.path.join(OUT, 'index.json')
              index = {'shards': {}}
              if os.path.exists(index_path):
                  try:
                      index = json.load(open(index_path, encoding='utf8'))
                  except Exception:
                      pass
              failed = []
              summary = []
              for sid in ids:
                  if sid not in byid:
                      continue
                  log('=' * 60, '\nمحافظة:', sid)
                  rep = build_shard(byid[sid], url, release, req['min_area'], debug=debug)
                  rep['source_url'] = url
                  rep['built_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                  with open(os.path.join(OUT, 'report', sid + '.json'), 'w', encoding='utf8') as f:
                      json.dump(rep, f, ensure_ascii=False, indent=1)
                  log('النتيجة:', sid, rep['status'], rep.get('bytes'))
                  sl = rep.get('slim') or {}
                  summary.append((sid, rep['status'], rep.get('bytes'), (sl.get('features') or {}).get('kept'), ((sl.get('features') or {}).get('with_height') or 0) + ((sl.get('features') or {}).get('height_from_floors') or 0), rep.get('seconds')))
                  if rep['status'] == 'ok' and not debug:
                      sl = rep['slim']
                      index['shards'][sid] = {
                          'id': sid, 'name': byid[sid].get('name'), 'bbox': byid[sid]['bbox'], 'bytes': rep['bytes'],
                          'release': release, 'built_at': rep['built_at'],
                          'buildings': sl['features']['kept'], 'with_height': sl['features']['with_height'] + sl['features']['height_from_floors'],
                      }
                  elif rep['status'] != 'ok':
                      failed.append(sid)
              if not debug:
                  index['source'] = 'Overture Maps buildings ' + str(release)
                  index['attribution'] = '(c) OpenStreetMap contributors, (c) Overture Maps Foundation'
                  with open(index_path, 'w', encoding='utf8') as f:
                      json.dump(index, f, ensure_ascii=False, indent=1)
              write_summary(req['mode'], url, release, summary)
              if unknown:
                  log('معرّفات غير معروفة:', unknown)
              if failed or unknown:
                  log('فشلت:', failed, 'غير معروفة:', unknown)
                  return 1
              return 0


          if __name__ == '__main__':
              sys.exit(main())
