              44.9,
              32.0,
              46.9,
              33.5
             ]
            }
           ]
          }
          __DALINY_EOF__
          cat > tools/install_pmtiles.sh <<'__DALINY_EOF__'
          #!/usr/bin/env bash
          # يثبّت أداة pmtiles (go-pmtiles) على سيرفر GitHub Actions
          set -uo pipefail
          mkdir -p /tmp/pm
          if gh release download --repo protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' --dir /tmp/pm --clobber; then
            tar -xzf /tmp/pm/*Linux_x86_64.tar.gz -C /tmp/pm && sudo install -m 0755 /tmp/pm/pmtiles /usr/local/bin/pmtiles && echo "pmtiles installed from release"
          fi
          if ! command -v pmtiles >/dev/null 2>&1; then
            echo "release download failed; building with go install"
            GOBIN=/tmp/pm/bin go install github.com/protomaps/go-pmtiles@latest
            sudo install -m 0755 /tmp/pm/bin/go-pmtiles /usr/local/bin/pmtiles
          fi
          pmtiles --help 2>&1 | head -3
          df -h / | tail -1
          python3 --version
          __DALINY_EOF__
          cat > tools/commit.sh <<'__DALINY_EOF__'
          #!/usr/bin/env bash
          # يحفظ مجلد bld/ بالمستودع (commit + push) مع إعادة المحاولة
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bld
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "bld: ${1:-update}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed"
              exit 0
            fi
            sleep 10
          done
          echo "push failed"
          exit 1
          __DALINY_EOF__

      - name: Install pmtiles
        run: bash tools/install_pmtiles.sh

      - name: "1) debug sample (Hilla)"
        id: s1
        if: env.MODE == 'auto' || env.MODE == 'debug'
        continue-on-error: true
        env:
          BLD_MODE: debug
        run: python3 tools/bld_run.py

      - name: "Commit 1"
        if: always() && (env.MODE == 'auto' || env.MODE == 'debug')
        run: bash tools/commit.sh "debug sample"

      - name: "2) babil"
        id: s2
        if: env.MODE == 'auto' && steps.s1.outcome == 'success'
        continue-on-error: true
        env:
          BLD_MODE: build
          BLD_IDS: babil
        run: python3 tools/bld_run.py

      - name: "Commit 2"
        if: always() && env.MODE == 'auto' && steps.s1.outcome == 'success'
        run: bash tools/commit.sh "babil"

      - name: "3) other governorates"
        id: s3
        if: env.MODE == 'auto' && steps.s2.outcome == 'success'
        continue-on-error: true
        env:
          BLD_MODE: build
          BLD_IDS: all
          BLD_SKIP: babil
        run: python3 tools/bld_run.py

      - name: "Commit 3"
        if: always() && env.MODE == 'auto' && steps.s2.outcome == 'success'
        run: bash tools/commit.sh "other governorates"

      - name: "Manual build"
        id: s4
        if: env.MODE == 'build'
        continue-on-error: true
        env:
          BLD_MODE: build
          BLD_IDS: ${{ github.event.inputs.ids }}
        run: python3 tools/bld_run.py

      - name: "Commit manual"
        if: always() && env.MODE == 'build'
        run: bash tools/commit.sh "manual build"

      - name: Ask Pages to rebuild
        if: always()
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (non-fatal)"

      - name: Fail if any stage failed
        if: steps.s1.outcome == 'failure' || steps.s2.outcome == 'failure' || steps.s3.outcome == 'failure' || steps.s4.outcome == 'failure'
        run: exit 1
